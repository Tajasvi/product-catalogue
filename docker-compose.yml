services:
  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 100
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:8080
      FAKE_STORE_API_URL: ${FAKE_STORE_API_URL:-https://fakestoreapi.com}
      FAKE_STORE_TIMEOUT_MS: ${FAKE_STORE_TIMEOUT_MS:-5000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-catalogue@example.test}
      SALES_INBOX: ${SALES_INBOX:-sales@example.test}
    depends_on:
      mailpit:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

